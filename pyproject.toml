[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognodb-graph-benchmark"
version = "0.1.0"
description = "Reproducible, fair graph database cloud benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "neo4j==5.28.1",
  "redis==6.4.0",
  "requests==2.32.3",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "python-dotenv==1.0.1",
  "psutil==6.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.4"]

[project.scripts]
graphbench = "graphbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
